<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoxShop — Catálogo con búsqueda por voz</title>
<meta name="theme-color" content="#0a0806">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0806; --ink:#f5efe2; --dim:#a39880; --line:rgba(212,175,55,.18);
    --gold:#d4af37; --gold-l:#ffe9a8;
    --grad:linear-gradient(135deg,#8c6d1f,#d4af37 40%,#ffe9a8 55%,#d4af37 70%,#8c6d1f);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
    font-weight:300;line-height:1.6;padding-bottom:40px;min-height:100svh;
    background-image:radial-gradient(800px 500px at 50% -10%,rgba(212,175,55,.08),transparent 70%);
  }
  .mono{font-family:'IBM Plex Mono',monospace}
  .serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-.02em}

  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}

  /* Header */
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;max-width:1100px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:'Fraunces',serif;font-size:1.15rem;letter-spacing:.3em;font-weight:500;color:var(--ink);padding-left:.3em}
  .brand .dot{width:8px;height:8px;border-radius:50% 50% 50% 0;background:var(--grad);transform:rotate(-45deg);box-shadow:0 0 14px var(--gold)}
  .cart{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:8px 14px}

  /* Hero */
  .hero{text-align:center;padding:20px 16px 34px}
  .hero h1{font-family:'Fraunces',serif;font-size:clamp(2rem,8vw,3.2rem);line-height:1.02;font-weight:400;letter-spacing:-.025em;margin-bottom:12px}
  .hero h1 em{font-style:italic;background:var(--grad);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:flow 7s linear infinite}
  @keyframes flow{to{background-position:220% center}}
  .hero p{color:var(--dim);font-size:.92rem;max-width:44ch;margin:0 auto}

  /* Botón de voz */
  .voice-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:26px auto 10px;max-width:520px}
  .voice-btn{
    position:relative;width:112px;height:112px;border-radius:50%;border:0;cursor:pointer;
    background:var(--grad);background-size:220% auto;color:#141007;
    display:grid;place-items:center;
    box-shadow:0 22px 60px -20px rgba(212,175,55,.9),0 0 0 1px rgba(212,175,55,.35) inset;
    transition:transform .25s,box-shadow .35s,background-position .7s;
    -webkit-tap-highlight-color:transparent;
  }
  .voice-btn:hover{background-position:120% center;transform:scale(1.04)}
  .voice-btn:active{transform:scale(.96)}
  .voice-btn svg{width:42px;height:42px;stroke:#141007;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .voice-btn .ripple{position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,233,168,.5);opacity:0;pointer-events:none}
  .voice-btn.listening{animation:pulseBtn 1.6s ease-in-out infinite}
  .voice-btn.listening .ripple{animation:rippleOut 1.8s ease-out infinite}
  .voice-btn.listening .ripple.d2{animation-delay:.6s}
  .voice-btn.listening .ripple.d3{animation-delay:1.2s}
  @keyframes pulseBtn{0%,100%{box-shadow:0 22px 60px -20px rgba(212,175,55,.9),0 0 0 0 rgba(255,77,109,.7)}50%{box-shadow:0 22px 60px -20px rgba(212,175,55,.9),0 0 0 22px rgba(255,77,109,0)}}
  @keyframes rippleOut{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
  .voice-label{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);text-align:center}
  .voice-label b{color:var(--gold-l);font-weight:400}

  /* Transcript en vivo */
  .transcript{
    min-height:52px;margin:14px auto 0;max-width:600px;padding:14px 20px;
    background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;
    font-family:'IBM Plex Mono',monospace;font-size:.82rem;line-height:1.5;
    color:var(--dim);text-align:center;
    opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;
  }
  .transcript.on{opacity:1;transform:none}
  .transcript b{color:var(--gold-l);font-weight:400}
  .transcript .heard{color:var(--ink)}

  /* Fallback texto */
  .fallback{display:flex;gap:8px;margin:16px auto 0;max-width:520px}
  .fallback input{
    flex:1;min-height:48px;padding:0 16px;border-radius:12px;
    background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--ink);
    font-family:'Inter',sans-serif;font-size:16px;font-weight:300;
  }
  .fallback input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
  .fallback button{
    min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;
    font-family:'Inter',sans-serif;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
  }

  /* Barra de filtros activos */
  .filters-bar{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    margin:22px auto 6px;max-width:680px;min-height:34px;
  }
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 14px;border-radius:999px;
    background:rgba(212,175,55,.14);border:1px solid rgba(212,175,55,.4);
    font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--gold-l);
  }
  .chip button{
    background:none;border:0;color:var(--gold-l);cursor:pointer;font-size:1rem;line-height:1;
    padding:0;opacity:.7;width:18px;height:18px;display:grid;place-items:center;border-radius:50%;
  }
  .chip button:hover{background:rgba(255,233,168,.15);opacity:1}
  .chip-clear{background:rgba(255,255,255,.06);border-color:var(--line);color:var(--dim);cursor:pointer;padding:6px 14px}

  /* Contador */
  .count{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:8px 0 22px}
  .count b{color:var(--gold-l);font-weight:400}

  /* Grid productos */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;padding-bottom:40px}
  .prod{
    position:relative;border-radius:16px;overflow:hidden;
    border:1px solid var(--line);background:#0d0a07;
    transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s;
    animation:fadeIn .4s ease both;
  }
  .prod:hover{transform:translateY(-3px);border-color:rgba(212,175,55,.5);box-shadow:0 24px 60px -30px rgba(212,175,55,.7)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}}
  .prod .img{
    aspect-ratio:1;display:grid;place-items:center;font-size:3.4rem;position:relative;
    background:linear-gradient(160deg,var(--c1,#1a1a2e),var(--c2,#0d0a07));
  }
  .prod .img::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),transparent 55%);
    pointer-events:none;
  }
  .prod .info{padding:12px 12px 14px}
  .prod .brand-mini{font-family:'IBM Plex Mono',monospace;font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
  .prod .name{font-family:'Fraunces',serif;font-size:.98rem;font-weight:500;line-height:1.2;margin-bottom:8px;color:var(--ink)}
  .prod .price{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--gold-l);margin-bottom:8px}
  .prod .tags{display:flex;flex-wrap:wrap;gap:4px}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:.52rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--dim);border:1px solid rgba(255,255,255,.05)}
  .tag.match{background:rgba(212,175,55,.22);color:var(--gold-l);border-color:rgba(212,175,55,.4)}

  /* Vacío */
  .empty{text-align:center;padding:56px 20px;grid-column:1/-1}
  .empty .ico{font-size:3rem;margin-bottom:14px;opacity:.5}
  .empty h3{font-family:'Fraunces',serif;font-size:1.4rem;margin-bottom:8px}
  .empty p{color:var(--dim);font-size:.88rem;max-width:40ch;margin:0 auto 16px}
  .empty button{
    min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--ink);cursor:pointer;
    font-family:'Inter',sans-serif;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  }
  .empty button:hover{border-color:var(--gold);color:var(--gold-l)}

  /* Aviso no soportado */
  .warn{
    max-width:520px;margin:12px auto 0;padding:11px 16px;border-radius:12px;
    background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.35);
    font-size:.78rem;color:#ffb3c1;text-align:center;line-height:1.5;
  }

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="hdr">
  <a href="#" class="brand"><span class="dot"></span>VOXSHOP</a>
  <div class="cart">Calzado</div>
</header>

<section class="hero">
  <h1 class="serif">Busca <em>hablando</em></h1>
  <p>Toca el micrófono y di lo que quieres. Por ejemplo: <strong style="color:var(--gold-l)">«quiero tenis negros talla cuarenta y uno»</strong></p>
</section>

<div class="wrap">
  <div class="voice-wrap">
    <button class="voice-btn" id="voiceBtn" type="button" aria-label="Buscar por voz">
      <span class="ripple"></span><span class="ripple d2"></span><span class="ripple d3"></span>
      <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>
    </button>
    <p class="voice-label" id="voiceLabel">Toca y <b>habla</b></p>
  </div>

  <div class="transcript" id="transcript" role="status" aria-live="polite"></div>

  <form class="fallback" id="fallback" autocomplete="off">
    <input type="text" id="textInput" placeholder="…o escribe: tenis talla 41" aria-label="Buscar escribiendo">
    <button type="submit">Buscar</button>
  </form>

  <div class="filters-bar" id="filtersBar"></div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</div>

<script>
(function(){
  'use strict';

  /* =========================================================
     CATÁLOGO (en un negocio real esto vendría de productos.json)
     ========================================================= */
  var PRODUCTS = [
    { id:1,  name:'Air Zoom Pegasus', brand:'Nike',     category:'tenis',     gender:'hombre', colors:['negro','blanco'],   sizes:[39,40,41,42,43,44], price:850,  emoji:'👟', c1:'#1a1a2e', c2:'#0d0a07' },
    { id:2,  name:'Ultraboost 22',    brand:'Adidas',   category:'tenis',     gender:'hombre', colors:['azul','negro'],    sizes:[40,41,42,43],       price:1100, emoji:'👟', c1:'#0f3460', c2:'#0d0a07' },
    { id:3,  name:'Cloud Runner',     brand:'On',       category:'tenis',     gender:'mujer',  colors:['rosa','blanco'],   sizes:[36,37,38,39],       price:980,  emoji:'👟', c1:'#533483', c2:'#0d0a07' },
    { id:4,  name:'Stan Smith',       brand:'Adidas',   category:'tenis',     gender:'unisex', colors:['blanco','verde'],  sizes:[38,39,40,41,42,43,44], price:720, emoji:'👟', c1:'#2d6a4f', c2:'#0d0a07' },
    { id:5,  name:'Chuck Taylor',     brand:'Converse', category:'tenis',     gender:'unisex', colors:['negro','blanco','rojo'], sizes:[37,38,39,40,41,42,43,44], price:550, emoji:'👟', c1:'#7a0c0c', c2:'#0d0a07' },
    { id:6,  name:'Chelsea Boot',     brand:'Clarks',   category:'botas',     gender:'hombre', colors:['cafe','negro'],    sizes:[40,41,42,43,44],    price:1350, emoji:'👢', c1:'#5d3a1a', c2:'#0d0a07' },
    { id:7,  name:'Heels Classic',    brand:'Aldo',     category:'tacones',   gender:'mujer',  colors:['negro','rojo'],    sizes:[35,36,37,38,39],    price:890,  emoji:'👠', c1:'#7a0c0c', c2:'#0d0a07' },
    { id:8,  name:'Sandalia Verano',  brand:'Havaianas', category:'sandalias', gender:'mujer',  colors:['dorado','plateado'], sizes:[35,36,37,38,39,40], price:320, emoji:'🩴', c1:'#b8860b', c2:'#0d0a07' },
    { id:9,  name:'Trail Runner',     brand:'Salomon',  category:'tenis',     gender:'hombre', colors:['verde','negro'],   sizes:[41,42,43,44,45],    price:1250, emoji:'👟', c1:'#2d6a4f', c2:'#0d0a07' },
    { id:10, name:'Slip-On Clásico',  brand:'Vans',     category:'tenis',     gender:'unisex', colors:['negro','blanco','azul'], sizes:[38,39,40,41,42,43,44], price:620, emoji:'👟', c1:'#1b263b', c2:'#0d0a07' },
    { id:11, name:'Oxford Elegante',  brand:'Clarks',   category:'zapatos',   gender:'hombre', colors:['cafe','negro'],    sizes:[39,40,41,42,43,44], price:1450, emoji:'👞', c1:'#5d3a1a', c2:'#0d0a07' },
    { id:12, name:'Bailarina',        brand:'Zara',     category:'zapatos',   gender:'mujer',  colors:['beige','negro'],   sizes:[35,36,37,38,39],    price:480,  emoji:'👞', c1:'#a68a64', c2:'#0d0a07' }
  ];

  /* =========================================================
     PARSER: el verdadero cerebro de la búsqueda por voz
     ========================================================= */

  // Quita tildes y pasa a minúsculas para comparar
  function norm(s){
    return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  // Convierte "cuarenta y uno", "cuarenta y un", "41" o "treinta y cinco" a número
  var TENS = { veinte:20, treinta:30, cuarenta:40, cincuenta:50 };
  var UNITS = { uno:1, un:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8, nueve:9 };
  var ONEWORD = {
    veintiuno:21, veintiun:21, veintidos:22, veintitres:23, veinticuatro:24,
    veinticinco:25, veintiseis:26, veintisiete:27, veintiocho:28, veintinueve:29
  };

  function extractNumber(text){
    // número directo (ej. "41")
    var m = text.match(/\b(\d{1,3})\b/);
    if (m) return parseInt(m[1], 10);
    // "veinticinco", etc.
    m = text.match(/\b(veintiuno|veintiun|veintidos|veintitres|veinticuatro|veinticinco|veintiseis|veintisiete|veintiocho|veintinueve)\b/);
    if (m) return ONEWORD[m[1]];
    // "cuarenta y uno"
    m = text.match(/\b(veinte|treinta|cuarenta|cincuenta)(?:\s+y\s+(uno|un|dos|tres|cuatro|cinco|seis|siete|ocho|nueve))?\b/);
    if (m){
      var t = TENS[m[1]] || 0;
      var u = m[2] ? (UNITS[m[2]] || 0) : 0;
      return t + u;
    }
    return null;
  }

  var COLORS = ['negro','negra','blanco','blanca','rojo','roja','azul','verde','rosa','rosado','gris','cafe','beige','dorado','plateado','morado','violeta','amarillo','naranja','celeste','marron'];

  function extractColor(text){
    for (var i=0;i<COLORS.length;i++){
      if (new RegExp('\\b' + COLORS[i] + 's?\\b').test(text)){
        // singular
        return COLORS[i].replace(/a$/,'o').replace(/s$/,'');
      }
    }
    return null;
  }

  var CATS = ['tenis','zapatillas','zapatos','sandalias','botas','tacones','deportivos','casuales','formales'];
  function extractCategory(text){
    for (var i=0;i<CATS.length;i++){
      if (new RegExp('\\b' + CATS[i] + '\\b').test(text)) return CATS[i];
    }
    return null;
  }

  function extractGender(text){
    if (/\b(hombre|caballero|masculino|varon)\b/.test(text)) return 'hombre';
    if (/\b(mujer|dama|femenin|senora|chica)\b/.test(text)) return 'mujer';
    if (/\b(nino|nina|infantil|chico|chica)\b/.test(text)) return 'unisex';
    return null;
  }

  // Traduce "tenis"→"tenis", "zapatillas"→"tenis", etc. para que coincida con el catálogo
  function normalizeCategory(cat){
    if (!cat) return null;
    if (cat === 'zapatillas' || cat === 'deportivos') return 'tenis';
    if (cat === 'formales' || cat === 'casuales') return 'zapatos';
    return cat;
  }

  function parseQuery(rawText){
    var t = norm(rawText);
    var q = { raw: rawText, size:null, color:null, category:null, gender:null };
    q.size = extractNumber(t);
    q.color = extractColor(t);
    q.category = normalizeCategory(extractCategory(t));
    q.gender = extractGender(t);
    return q;
  }

  /* =========================================================
     FILTRO
     ========================================================= */
  function filterProducts(query){
    return PRODUCTS.filter(function(p){
      if (query.size && p.sizes.indexOf(query.size) === -1) return false;
      if (query.color && p.colors.indexOf(query.color) === -1) return false;
      if (query.category && p.category !== query.category) return false;
      if (query.gender && p.gender !== query.gender && p.gender !== 'unisex') return false;
      return true;
    });
  }

  /* =========================================================
     RENDER
     ========================================================= */
  var grid = document.getElementById('grid');
  var countEl = document.getElementById('count');
  var filtersBar = document.getElementById('filtersBar');
  var state = { query:{} };

  function render(){
    var q = state.query;
    var results = filterProducts(q);
    grid.innerHTML = '';

    // contador
    if (Object.keys(q).some(function(k){ return k !== 'raw' && q[k]; })){
      countEl.innerHTML = 'Encontré <b>' + results.length + '</b> ' + (results.length === 1 ? 'producto' : 'productos');
    } else {
      countEl.innerHTML = '<b>' + results.length + '</b> productos en el catálogo';
    }

    // chips de filtros activos
    filtersBar.innerHTML = '';
    var chips = [];
    if (q.category) chips.push({ k:'category', label:q.category });
    if (q.color) chips.push({ k:'color', label:q.color });
    if (q.gender) chips.push({ k:'gender', label:q.gender });
    if (q.size) chips.push({ k:'size', label:'talla ' + q.size });

    chips.forEach(function(c){
      var el = document.createElement('span');
      el.className = 'chip';
      el.innerHTML = c.label + ' <button type="button" aria-label="Quitar filtro">×</button>';
      el.querySelector('button').addEventListener('click', function(){
        delete state.query[c.k];
        render();
      });
      filtersBar.appendChild(el);
    });
    if (chips.length){
      var clear = document.createElement('button');
      clear.type = 'button';
      clear.className = 'chip chip-clear';
      clear.textContent = 'Limpiar todo';
      clear.addEventListener('click', function(){ state.query = {}; render(); });
      filtersBar.appendChild(clear);
    }

    // sin resultados
    if (!results.length){
      var emp = document.createElement('div');
      emp.className = 'empty';
      emp.innerHTML = '<div class="ico">🔍</div><h3 class="serif">Nada por aquí</h3>' +
        '<p>No encontré productos con esos criterios. Prueba con otros filtros.</p>';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = 'Ver todo el catálogo';
      btn.addEventListener('click', function(){ state.query = {}; render(); });
      emp.appendChild(btn);
      grid.appendChild(emp);
      return;
    }

    // tarjetas
    results.forEach(function(p){
      var card = document.createElement('div');
      card.className = 'prod';
      var matches = [];
      if (q.color && p.colors.indexOf(q.color) !== -1) matches.push(q.color);
      card.innerHTML =
        '<div class="img" style="--c1:' + p.c1 + ';--c2:' + p.c2 + '">' + p.emoji + '</div>' +
        '<div class="info">' +
          '<div class="brand-mini">' + p.brand + '</div>' +
          '<div class="name">' + p.name + '</div>' +
          '<div class="price">Bs. ' + p.price + '</div>' +
          '<div class="tags">' +
            '<span class="tag' + (q.category === p.category ? ' match' : '') + '">' + p.category + '</span>' +
            '<span class="tag' + (q.gender === p.gender || p.gender === 'unisex' && q.gender ? ' match' : '') + '">' + p.gender + '</span>' +
            '<span class="tag' + (q.size && p.sizes.indexOf(q.size) !== -1 ? ' match' : '') + '">' + (q.size || p.sizes[0]) + '–' + p.sizes[p.sizes.length-1] + '</span>' +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    });
  }

  /* =========================================================
     RECONOCIMIENTO DE VOZ
     ========================================================= */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var voiceBtn = document.getElementById('voiceBtn');
  var voiceLabel = document.getElementById('voiceLabel');
  var transcriptEl = document.getElementById('transcript');
  var fallback = document.getElementById('fallback');
  var textInput = document.getElementById('textInput');

  function showTranscript(html, on){
    transcriptEl.innerHTML = html;
    transcriptEl.classList.toggle('on', !!on);
  }

  function applyText(text){
    showTranscript('Escuché: <span class="heard">«' + text + '»</span>', true);
    var q = parseQuery(text);
    state.query = q;
    render();

    // feedback de lo interpretado
    var parts = [];
    if (q.category) parts.push(q.category);
    if (q.color) parts.push(q.color);
    if (q.gender) parts.push(q.gender);
    if (q.size) parts.push('talla ' + q.size);

    if (parts.length){
      showTranscript('Escuché: <span class="heard">«' + text + '»</span><br><b>→ ' + parts.join(' · ') + '</b>', true);
    } else {
      showTranscript('Escuché: <span class="heard">«' + text + '»</span><br>No detecté criterios claros. Prueba: <b>«tenis negros talla 41»</b>', true);
    }
  }

  if (!SR){
    // Navegador sin soporte
    var warn = document.createElement('div');
    warn.className = 'warn';
    warn.textContent = 'Tu navegador no soporta reconocimiento de voz. Usa el campo de texto (o el micrófono del teclado del celular).';
    document.querySelector('.voice-wrap').appendChild(warn);
    voiceBtn.style.display = 'none';
    voiceLabel.textContent = 'Búsqueda por texto';
  } else {
    var recog = new SR();
    recog.lang = 'es-419';        // español latinoamericano
    recog.continuous = false;
    recog.interimResults = true;
    recog.maxAlternatives = 1;

    var listening = false;

    voiceBtn.addEventListener('click', function(){
      if (listening){ recog.stop(); return; }
      try { recog.start(); } catch(e){}
    });

    recog.onstart = function(){
      listening = true;
      voiceBtn.classList.add('listening');
      voiceLabel.innerHTML = 'Escuchando… <b>habla ahora</b>';
      showTranscript('🎤 Escuchando…', true);
    };

    recog.onresult = function(e){
      var interim = '', final = '';
      for (var i = e.resultIndex; i < e.results.length; i++){
        var txt = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += txt; else interim += txt;
      }
      if (interim){
        showTranscript('🎤 <span class="heard">' + interim + '…</span>', true);
      }
      if (final){
        applyText(final.trim());
      }
    };

    recog.onerror = function(e){
      listening = false;
      voiceBtn.classList.remove('listening');
      voiceLabel.innerHTML = 'Toca y <b>habla</b>';
      var msg = 'No pude escucharte.';
      if (e.error === 'not-allowed') msg = 'Permiso de micrófono denegado. Actívalo en tu navegador.';
      else if (e.error === 'no-speech') msg = 'No escuché nada. Intenta de nuevo.';
      else if (e.error === 'audio-capture') msg = 'No hay micrófono disponible.';
      else if (e.error === 'network') msg = 'Sin conexión para el reconocimiento.';
      showTranscript('<b>' + msg + '</b>', true);
    };

    recog.onend = function(){
      listening = false;
      voiceBtn.classList.remove('listening');
      voiceLabel.innerHTML = 'Toca y <b>habla</b>';
    };
  }

  // Fallback por texto
  fallback.addEventListener('submit', function(e){
    e.preventDefault();
    var v = textInput.value.trim();
    if (v) applyText(v);
  });

  /* =========================================================
     INICIAL
     ========================================================= */
  render();
})();
</script>
</body>
</html>
