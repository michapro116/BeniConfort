<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BeniConfort | Compartir catálogo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --black:#111;
  --ink:#171717;
  --muted:#707070;
  --line:#e5e5e5;
  --soft:#f5f5f3;
  --green:#16864a;
  --red:#b00020;
  --yellow:#d49a00;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#f5f5f3;
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding:20px;
}

.container{
  max-width:1000px;
  margin:0 auto;
}

/* HEADER */

.header{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
}

.connection{
  font-size:11px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:7px;
}

.connection-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#aaa;
}

.connection-dot.ok{
  background:var(--green);
}

.connection-dot.error{
  background:var(--red);
}

.connection-dot.loading{
  background:var(--yellow);
}

/* STATUS */

.status{
  background:#fff;
  border-radius:16px;
  padding:25px;
  text-align:center;
  margin-bottom:16px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.status h2{
  margin:0 0 8px;
  font-size:18px;
}

.status p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

/* TALLAS */

.size-box{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.size-title{
  font-size:11px;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-bottom:12px;
}

.sizes{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.size-btn{
  border:1px solid #ccc;
  background:#fff;
  color:#111;
  border-radius:8px;
  padding:10px 14px;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}

.size-btn:hover{
  background:#f3f3f3;
}

.size-btn.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

/* ACTION BAR */

.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.selected-info{
  font-size:13px;
  font-weight:800;
}

.action-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  font:inherit;
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}

.btn-light{
  background:#eee;
  color:#111;
}

.btn-green{
  background:#16864a;
  color:#fff;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}

.card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  border:2px solid transparent;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
  cursor:pointer;
}

.card.selected{
  border-color:#111;
}

.image-box{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#f5f5f3;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.image-box img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.image-error{
  text-align:center;
  padding:20px;
  font-size:12px;
  color:#b00020;
  word-break:break-word;
}

.check{
  position:absolute;
  top:10px;
  right:10px;
  width:28px;
  height:28px;
  border-radius:50%;
  background:#fff;
  border:2px solid #aaa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  font-weight:900;
}

.card.selected .check{
  background:#111;
  border-color:#111;
  color:#fff;
}

.card-info{
  padding:15px;
}

.type{
  display:inline-block;
  background:#111;
  color:#fff;
  padding:6px 8px;
  border-radius:5px;
  font-size:8px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:9px;
}

.brand{
  font-size:10px;
  color:#555;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.name{
  margin-top:4px;
  font-size:20px;
  line-height:1.05;
  font-weight:900;
}

.meta{
  margin-top:8px;
  font-size:11px;
  font-weight:800;
}

.prices{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.price{
  flex:1;
  background:#f5f5f3;
  border-radius:8px;
  padding:8px;
}

.price small{
  display:block;
  font-size:7px;
  color:#777;
  text-transform:uppercase;
  font-weight:800;
}

.price strong{
  display:block;
  margin-top:3px;
  font-size:15px;
}

/* GENERATING */

.generating{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.generating-box{
  background:#fff;
  border-radius:16px;
  padding:30px;
  width:min(90%,350px);
  text-align:center;
}

.spinner{
  width:35px;
  height:35px;
  border:4px solid #ddd;
  border-top-color:#111;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.empty{
  background:#fff;
  border-radius:16px;
  padding:50px 20px;
  text-align:center;
  color:#777;
}

@media(max-width:700px){

  body{
    padding:10px;
  }

  .products{
    grid-template-columns:1fr;
  }

  .header-top{
    align-items:flex-start;
  }

  .actions{
    align-items:stretch;
  }

  .action-buttons{
    width:100%;
  }

  .action-buttons .btn{
    flex:1;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="header-top">

      <div class="logo">
        BENICONFORT
      </div>

      <div class="connection">

        <span
          id="connectionDot"
          class="connection-dot loading">
        </span>

        <span id="connectionText">
          Conectando...
        </span>

      </div>

    </div>

  </div>


  <div id="status" class="status">

    <h2>Cargando inventario...</h2>

    <p>
      Consultando modelos disponibles.
    </p>

  </div>


  <div id="mainContent" style="display:none;">

    <div class="size-box">

      <div class="size-title">
        Selecciona una talla
      </div>

      <div
        id="sizes"
        class="sizes">
      </div>

    </div>


    <div class="actions">

      <div
        id="selectedInfo"
        class="selected-info">

        0 modelos seleccionados

      </div>

      <div class="action-buttons">

        <button
          id="selectAllBtn"
          class="btn btn-light">

          Seleccionar todos

        </button>

        <button
          id="clearBtn"
          class="btn btn-light">

          Limpiar

        </button>

        <button
          id="shareBtn"
          class="btn btn-green"
          disabled>

          Compartir

        </button>

      </div>

    </div>


    <div
      id="products"
      class="products">
    </div>

  </div>

</div>


<div
  id="generating"
  class="generating">

  <div class="generating-box">

    <div class="spinner"></div>

    <h3>
      Preparando imágenes...
    </h3>

    <p
      id="generatingText"
      style="font-size:12px;color:#666;">

      Generando archivos reales.

    </p>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
   EXACTAMENTE LA MISMA DEL CATALOGO.HTML
========================================================= */

const WHATSAPP_NUMBER = "59173913409";

const SUPABASE_URL =
  "https://lydlyusuanvjjoavbocr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CO9yXE5Kj0dpqebMA2_d7Q_DpQKkQpq";

const SIZE_MIN = 34;
const SIZE_MAX = 45;


/* =========================================================
   UTILIDADES
========================================================= */

function text(v){

  return v == null
    ? ""
    : String(v).trim();

}


function money(v){

  const n = Number(v || 0);

  return `Bs ${n.toLocaleString('es-BO')}`;

}


function normalizeStatus(v){

  const s =
    text(v).toLowerCase();

  if(
    ["vendido","sold"].includes(s)
  ){

    return "sold";

  }

  if(
    ["reservado","reserved"].includes(s)
  ){

    return "reserved";

  }

  return "available";

}


/* =========================================================
   NORMALIZAR PRODUCTO
   MISMO CÓDIGO DEL CATALOGO
========================================================= */

function normalizeProduct(p){

  const rawType =
    text(p.tipo ?? p.type);

  const typeLower =
    rawType.toLowerCase();

  const type =
    typeLower.includes("americano")
      ? "Americano"
      :
      typeLower.includes("económico") ||
      typeLower.includes("economico")
        ? "Económico"
        : rawType;


  let sizesQty =
    p.sizesQty;


  if(
    !sizesQty &&
    p.tamaños &&
    typeof p.tamaños === "object"
  ){

    sizesQty =
      p.tamaños;

  }


  if(
    typeof sizesQty === "string"
  ){

    try{

      sizesQty =
        JSON.parse(sizesQty);

    }catch{

      sizesQty = {};

    }

  }


  if(
    !sizesQty ||
    typeof sizesQty !== "object"
  ){

    sizesQty = {};

  }


  return {

    id:String(p.id ?? ""),

    type,

    quality:type,

    status:
      normalizeStatus(
        p.estado ?? p.status
      ),

    name:
      text(
        p.nombre ??
        p.name
      ),

    brand:
      text(
        p.marca ??
        p.brand
      ),

    gender:
      text(
        p.género ??
        p.gender
      ),

    img:
      text(
        p.image_url ??
        p.image
      ),

    cashPrice:
      Number(
        p.precio_efectivo ??
        p.price ??
        0
      ),

    creditPrice:
      Number(
        p.precio_crédito ??
        p.precio_credito ??
        p.price ??
        0
      ),

    initial:
      Number(
        p.initial_payment ??
        p.initial ??
        0
      ),

    stock:
      Number(
        p.stock ??
        0
      ),

    size:
      p.size ??
      "",

    sizesQty,

    tag:
      text(
        p.promoción ??
        p.tag
      ),

    desc:
      text(
        p.description ??
        p.desc
      ),

    whatsappLink:
      p.whatsapp_link ??
      p.WhatsApp_link ??
      p.whatsappLink ??
      ""

  };

}


/* =========================================================
   TALLAS
   MISMO CÓDIGO DEL CATALOGO
========================================================= */

function availableSizes(p){

  if(
    p.quality === "Americanos" ||
    p.quality === "Americano"
  ){

    if(
      p.status === "sold" ||
      p.status === "reserved" ||
      !p.size ||
      Number(p.stock ?? 1) <= 0
    ){

      return [];

    }


    const n =
      Number(p.size);


    return Number.isFinite(n)
      ? [n]
      : [];

  }


  return Object.keys(
    p.sizesQty || {}
  )
  .map(Number)
  .filter(
    s =>
      Number.isFinite(s) &&
      Number(p.sizesQty[s]) > 0 &&
      p.status !== "sold" &&
      p.status !== "reserved"
  );

}


function selectableProducts(products){

  return products.filter(
    p =>
      p.status !== "sold" &&
      p.status !== "reserved" &&
      availableSizes(p).length > 0 &&
      p.img
  );

}


function productForSize(p,size){

  return availableSizes(p)
    .includes(
      Number(size)
    );

}


/* =========================================================
   ESTADO
========================================================= */

let products = [];

let selectedSize = null;

let selectedProducts =
  new Set();


/* =========================================================
   ELEMENTOS
========================================================= */

const statusEl =
  document.getElementById(
    "status"
  );

const mainContent =
  document.getElementById(
    "mainContent"
  );

const sizesEl =
  document.getElementById(
    "sizes"
  );

const productsEl =
  document.getElementById(
    "products"
  );

const selectedInfo =
  document.getElementById(
    "selectedInfo"
  );

const shareBtn =
  document.getElementById(
    "shareBtn"
  );

const selectAllBtn =
  document.getElementById(
    "selectAllBtn"
  );

const clearBtn =
  document.getElementById(
    "clearBtn"
  );


/* =========================================================
   ESTADO DE CONEXIÓN
========================================================= */

function connectionLoading(){

  const dot =
    document.getElementById(
      "connectionDot"
    );

  const txt =
    document.getElementById(
      "connectionText"
    );

  dot.className =
    "connection-dot loading";

  txt.textContent =
    "Conectando...";

}


function connectionOK(){

  const dot =
    document.getElementById(
      "connectionDot"
    );

  const txt =
    document.getElementById(
      "connectionText"
    );

  dot.className =
    "connection-dot ok";

  txt.textContent =
    "Conectado";

}


function connectionError(){

  const dot =
    document.getElementById(
      "connectionDot"
    );

  const txt =
    document.getElementById(
      "connectionText"
    );

  dot.className =
    "connection-dot error";

  txt.textContent =
    "Error de conexión";

}


/* =========================================================
   CREAR TALLAS
========================================================= */

function createAvailableSizes(){

  const sizeSet =
    new Set();


  products.forEach(
    p => {

      availableSizes(p)
        .forEach(
          size => {

            if(
              size >= SIZE_MIN &&
              size <= SIZE_MAX
            ){

              sizeSet.add(size);

            }

          }
        );

    }
  );


  sizesEl.innerHTML = "";


  [...sizeSet]
    .sort(
      (a,b) => a-b
    )
    .forEach(
      size => {

        const btn =
          document.createElement(
            "button"
          );

        btn.className =
          "size-btn";

        btn.textContent =
          size;

        btn.dataset.size =
          size;


        btn.addEventListener(
          "click",
          () => {

            selectSize(size);

          }
        );


        sizesEl.appendChild(btn);

      }
    );


  if(!sizeSet.size){

    sizesEl.innerHTML =
      "<span style='color:#777;font-size:12px'>No hay tallas disponibles.</span>";

  }

}


/* =========================================================
   SELECCIONAR TALLA
========================================================= */

function selectSize(size){

  selectedSize =
    Number(size);

  selectedProducts =
    new Set();


  document
    .querySelectorAll(
      ".size-btn"
    )
    .forEach(
      btn => {

        btn.classList.toggle(
          "active",
          Number(btn.dataset.size)
            === selectedSize
        );

      }
    );


  renderProducts();

}


/* =========================================================
   MOSTRAR PRODUCTOS
========================================================= */

function renderProducts(){

  productsEl.innerHTML = "";


  if(selectedSize === null){

    productsEl.innerHTML = `
      <div
        class="empty"
        style="grid-column:1/-1">

        <h3>
          Selecciona una talla
        </h3>

        <p>
          Luego podrás seleccionar
          los modelos que quieres compartir.
        </p>

      </div>
    `;

    updateSelectionInfo();

    return;

  }


  const available =
    products.filter(
      p =>
        productForSize(
          p,
          selectedSize
        )
    );


  if(!available.length){

    productsEl.innerHTML = `
      <div
        class="empty"
        style="grid-column:1/-1">

        No hay modelos disponibles
        para la talla ${selectedSize}.

      </div>
    `;

    updateSelectionInfo();

    return;

  }


  available.forEach(
    p => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "card";


      if(
        selectedProducts.has(
          p.id
        )
      ){

        card.classList.add(
          "selected"
        );

      }


      card.innerHTML = `

        <div class="image-box">

          <img
            src="${escapeHtml(p.img)}"
            alt="${escapeHtml(p.name)}"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
          >

          <div class="check">
            ${
              selectedProducts.has(p.id)
                ? "✓"
                : ""
            }
          </div>

        </div>


        <div class="card-info">

          <div class="type">
            ${escapeHtml(
              p.type || "Tenis"
            )}
          </div>

          <div class="brand">
            ${escapeHtml(
              p.brand || "Marca"
            )}
          </div>

          <div class="name">
            ${escapeHtml(
              p.name ||
              "Modelo disponible"
            )}
          </div>

          <div class="meta">
            TALLA ${selectedSize}
          </div>

          <div class="prices">

            <div class="price">

              <small>
                Al contado
              </small>

              <strong>
                ${money(p.cashPrice)}
              </strong>

            </div>

            <div class="price">

              <small>
                Al crédito
              </small>

              <strong>
                ${money(p.creditPrice)}
              </strong>

            </div>

          </div>

        </div>
      `;


      const img =
        card.querySelector(
          "img"
        );


      img.addEventListener(
        "error",
        () => {

          img.style.display =
            "none";

          const box =
            img.parentElement;


          if(
            !box.querySelector(
              ".image-error"
            )
          ){

            box.insertAdjacentHTML(
              "beforeend",
              `
                <div class="image-error">
                  No se pudo cargar la imagen.
                </div>
              `
            );

          }

        }
      );


      card.addEventListener(
        "click",
        () => {

          toggleProduct(
            p.id,
            card
          );

        }
      );


      productsEl.appendChild(
        card
      );

    }
  );


  updateSelectionInfo();

}


/* =========================================================
   SELECCIONAR PRODUCTO
========================================================= */

function toggleProduct(
  id,
  card
){

  if(
    selectedProducts.has(id)
  ){

    selectedProducts.delete(id);

    card.classList.remove(
      "selected"
    );

    card.querySelector(
      ".check"
    ).textContent = "";

  }else{

    selectedProducts.add(id);

    card.classList.add(
      "selected"
    );

    card.querySelector(
      ".check"
    ).textContent = "✓";

  }


  updateSelectionInfo();

}


function updateSelectionInfo(){

  const count =
    selectedProducts.size;


  selectedInfo.textContent =
    `${count} modelo${count === 1 ? "" : "s"} seleccionado${count === 1 ? "" : "s"}`;


  shareBtn.disabled =
    count === 0;

}


/* =========================================================
   SELECCIONAR TODOS
========================================================= */

selectAllBtn.addEventListener(
  "click",
  () => {

    if(selectedSize === null){
      return;
    }


    const available =
      products.filter(
        p =>
          productForSize(
            p,
            selectedSize
          )
      );


    available.forEach(
      p =>
        selectedProducts.add(
          p.id
        )
    );


    renderProducts();

  }
);


/* =========================================================
   LIMPIAR
========================================================= */

clearBtn.addEventListener(
  "click",
  () => {

    selectedProducts =
      new Set();

    renderProducts();

  }
);


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(value){

  return text(value).replace(
    /[&<>'"]/g,
    c =>
      ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'
      }[c])
  );

}


/* =========================================================
   CARGAR INVENTARIO
   IMPORTANTE:
   LA CONEXIÓN SE CREA DENTRO DEL TRY
========================================================= */

async function loadInventory(){

  connectionLoading();


  statusEl.style.display =
    "block";


  statusEl.innerHTML = `
    <h2>
      Cargando inventario...
    </h2>

    <p>
      Consultando modelos disponibles.
    </p>
  `;


  try{

    /* -----------------------------------------
       COMPROBAR SUPABASE
    ----------------------------------------- */

    if(!window.supabase){

      throw new Error(
        "La biblioteca de Supabase no terminó de cargar."
      );

    }


    /* -----------------------------------------
       MISMA CONEXIÓN DEL CATALOGO
    ----------------------------------------- */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    console.log(
      "Supabase inicializado correctamente."
    );


    /* -----------------------------------------
       MISMA CONSULTA DEL CATALOGO
    ----------------------------------------- */

    const {
      data,
      error
    } =
      await supabaseClient
        .from("productos")
        .select("*");


    console.log(
      "Respuesta Supabase:",
      data,
      error
    );


    if(error){

      throw error;

    }


    /* -----------------------------------------
       NORMALIZAR
    ----------------------------------------- */

    products =
      selectableProducts(
        (data || [])
          .map(
            normalizeProduct
          )
      );


    console.log(
      "Total registros:",
      data
        ? data.length
        : 0
    );


    console.log(
      "Productos utilizables:",
      products.length
    );


    /* -----------------------------------------
       CONEXIÓN OK
    ----------------------------------------- */

    connectionOK();


    statusEl.style.display =
      "none";


    mainContent.style.display =
      "block";


    /* -----------------------------------------
       TALLAS
    ----------------------------------------- */

    createAvailableSizes();


    renderProducts();


  }catch(error){

    console.error(
      "ERROR COMPLETO DE SUPABASE:",
      error
    );


    connectionError();


    statusEl.innerHTML = `

      <h2>
        No se pudo cargar el inventario
      </h2>

      <p style="margin-bottom:12px;">
        Se produjo un error al conectar
        con el inventario.
      </p>

      <p style="
        font-size:12px;
        color:#b00020;
        word-break:break-word;
      ">
        ${escapeHtml(
          error?.message ||
          String(error)
        )}
      </p>

    `;

  }

}


/* =========================================================
   CARGAR IMAGEN PARA CANVAS
========================================================= */

function loadImage(url){

  return new Promise(
    (resolve,reject) => {

      const img =
        new Image();


      img.crossOrigin =
        "anonymous";


      img.referrerPolicy =
        "no-referrer";


      img.onload =
        () => resolve(img);


      img.onerror =
        () =>
          reject(
            new Error(
              "No se pudo cargar la imagen: " +
              url
            )
          );


      img.src =
        url;

    }
  );

}


/* =========================================================
   GENERAR JPG REAL
========================================================= */

async function generateProductImage(
  product,
  size
){

  const WIDTH = 1200;
  const HEIGHT = 1500;


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    WIDTH;

  canvas.height =
    HEIGHT;


  const ctx =
    canvas.getContext(
      "2d"
    );


  /* FONDO */

  ctx.fillStyle =
    "#ffffff";

  ctx.fillRect(
    0,
    0,
    WIDTH,
    HEIGHT
  );


  /* CABECERA */

  ctx.fillStyle =
    "#111111";

  ctx.font =
    "900 42px Arial";

  ctx.fillText(
    "BENICONFORT",
    70,
    85
  );


  ctx.font =
    "700 20px Arial";

  ctx.fillStyle =
    "#777777";

  ctx.fillText(
    "TENIS DISPONIBLES",
    70,
    125
  );


  /* IMAGEN REAL */

  const img =
    await loadImage(
      product.img
    );


  const areaX = 70;
  const areaY = 170;
  const areaW = 1060;
  const areaH = 720;


  const ratio =
    Math.min(
      areaW / img.naturalWidth,
      areaH / img.naturalHeight
    );


  const drawW =
    img.naturalWidth *
    ratio;


  const drawH =
    img.naturalHeight *
    ratio;


  const drawX =
    areaX +
    (areaW - drawW) / 2;


  const drawY =
    areaY +
    (areaH - drawH) / 2;


  ctx.drawImage(
    img,
    drawX,
    drawY,
    drawW,
    drawH
  );


  /* DIVISOR */

  ctx.fillStyle =
    "#111111";

  ctx.fillRect(
    70,
    925,
    1060,
    4
  );


  /* MARCA */

  ctx.fillStyle =
    "#555555";

  ctx.font =
    "900 25px Arial";

  ctx.fillText(
    (
      product.brand ||
      "BENICONFORT"
    ).toUpperCase(),
    70,
    985
  );


  /* NOMBRE */

  ctx.fillStyle =
    "#111111";

  ctx.font =
    "900 55px Arial";


  const productName =
    product.name ||
    "Modelo disponible";


  ctx.fillText(
    productName,
    70,
    1060
  );


  /* TALLA */

  ctx.font =
    "900 30px Arial";

  ctx.fillText(
    `TALLA ${size}`,
    70,
    1115
  );


  /* PRECIOS */

  ctx.font =
    "700 22px Arial";

  ctx.fillStyle =
    "#777777";

  ctx.fillText(
    "AL CONTADO",
    70,
    1190
  );

  ctx.fillText(
    "AL CRÉDITO",
    600,
    1190
  );


  ctx.fillStyle =
    "#111111";

  ctx.font =
    "900 42px Arial";

  ctx.fillText(
    money(product.cashPrice),
    70,
    1240
  );

  ctx.fillText(
    money(product.creditPrice),
    600,
    1240
  );


  /* PLAN DE CRÉDITO */

  if(
    product.initial > 0 &&
    product.creditPrice >
      product.initial
  ){

    const monthly =
      Math.max(
        0,
        (
          product.creditPrice -
          product.initial
        ) / 2
      );


    ctx.fillStyle =
      "#f1f1ee";

    ctx.fillRect(
      70,
      1280,
      1060,
      105
    );


    ctx.fillStyle =
      "#111111";

    ctx.font =
      "700 21px Arial";


    ctx.fillText(
      `Inicial ${money(product.initial)}  ·  Luego 2 pagos mensuales de ${money(monthly)}`,
      95,
      1330
    );

  }


  /* PIE */

  ctx.fillStyle =
    "#777777";

  ctx.font =
    "700 18px Arial";

  ctx.fillText(
    "Entregas a domicilio en Trinidad",
    70,
    1450
  );


  /* CREAR ARCHIVO JPG */

  return new Promise(
    (resolve,reject) => {

      canvas.toBlob(
        blob => {

          if(!blob){

            reject(
              new Error(
                "No se pudo crear el archivo JPG."
              )
            );

            return;

          }


          const safeName =
            (
              product.name ||
              "tenis"
            )
            .replace(
              /[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ_-]+/g,
              "-"
            )
            .replace(
              /^-+|-+$/g,
              ""
            );


          const file =
            new File(
              [blob],
              `BeniConfort-Talla-${size}-${safeName}.jpg`,
              {
                type:
                  "image/jpeg"
              }
            );


          resolve(file);

        },

        "image/jpeg",

        0.90

      );

    }
  );

}


/* =========================================================
   COMPARTIR VARIAS IMÁGENES REALES
========================================================= */

shareBtn.addEventListener(
  "click",
  async () => {

    if(
      selectedProducts.size === 0 ||
      selectedSize === null
    ){

      return;

    }


    const selected =
      products.filter(
        p =>
          selectedProducts.has(
            p.id
          ) &&
          productForSize(
            p,
            selectedSize
          )
      );


    const generating =
      document.getElementById(
        "generating"
      );


    const generatingText =
      document.getElementById(
        "generatingText"
      );


    generating.style.display =
      "flex";


    const archivos = [];


    try{

      for(
        let i = 0;
        i < selected.length;
        i++
      ){

        generatingText.textContent =
          `Preparando imagen ${i + 1} de ${selected.length}...`;


        const file =
          await generateProductImage(
            selected[i],
            selectedSize
          );


        archivos.push(
          file
        );

      }


      if(!archivos.length){

        throw new Error(
          "No se generaron imágenes."
        );

      }


      if(
        !navigator.share
      ){

        throw new Error(
          "Este dispositivo o navegador no permite compartir archivos."
        );

      }


      if(
        navigator.canShare &&
        !navigator.canShare({
          files: archivos
        })
      ){

        throw new Error(
          "El navegador no permite compartir estos archivos."
        );

      }


      generatingText.textContent =
        "Abriendo WhatsApp y otras aplicaciones...";


      await navigator.share({

        files:
          archivos,

        title:
          "Tenis BeniConfort",

        text:
          `Tenis disponibles talla ${selectedSize}`

      });


    }catch(error){

      console.error(
        "ERROR AL COMPARTIR:",
        error
      );


      if(
        error.name !==
        "AbortError"
      ){

        alert(
          error.message ||
          "No se pudieron compartir las imágenes."
        );

      }

    }finally{

      generating.style.display =
        "none";

    }

  }
);

loadInventory();

</script>
